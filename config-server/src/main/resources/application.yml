server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      enabled: true
      server:
        native:
          search-locations: classpath:/config
    inetutils:
      preferred-networks:
        - 10.207.*  # O puedes usar: - 10.207.6.*
  profiles:
    active: native
