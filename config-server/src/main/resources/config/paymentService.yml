spring:
    application:
        name: paymentService

    data:
        mongodb:
            host: localhost
            port: 27017
            database: paymentDB
            username: root
            password: root
            authentication-database: admin

    kafka:
        bootstrap-servers: localhost:9092
        properties:
            schema.registry.url: http://localhost:8081
        consumer:
            group-id: paymentConsumerGroup


    mvc:
        pathmatch:
            matching-strategy: ant_path_matcher

server:
    port: 8086

message:
    topic:
        ticket-created: ticket-created-topic
        ticket-payed: ticket-payed-topic

eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://localhost:8761/eureka
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
        metadata-map:
            zone: default