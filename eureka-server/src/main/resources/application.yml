server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      default-zone: http://${eureka.instance.hostname}:${server.port}/eureka/

spring:
  application:
    name: eureka-server

  cloud:
    inetutils:
      preferred-networks:
        - 10.207.*  # O puedes usar: - 10.207.6.*
    service-registry:
      auto-registration:
        enabled: false